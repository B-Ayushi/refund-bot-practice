[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-code-agent"
version = "0.1.0"
description = "Iterative code generation, review, and refactoring workflow"
requires-python = ">=3.11"
dependencies = ["google-adk>=1.0.0", "streamlit>=1.40.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]