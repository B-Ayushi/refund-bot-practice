[project]
name = "intelligent-travel-planner"
version = "0.1.0"
description = "Production-oriented multi-agent travel planning reference implementation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "google-genai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.36,<2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
